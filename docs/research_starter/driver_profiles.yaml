# Exploratory research design, not empirical calibration.
# All numeric two-element lists represent inclusive uniform sampling ranges.
project: SE4457 MAS synthetic driving telemetry research
configuration_version: proposal-0.1
warning: Exploratory, uncalibrated simulator settings. Validate model/parameter support
  and bounds with installed SUMO 1.28.0. No measured crash or insurance risk labels.
simulation:
  step_length_s: 0.5
  car_follow_model: Krauss
  lane_change_model: LC2013
  replications: 12
  route_vehicles: 300
  base_seed: 1001
sampler:
  method: seeded_uniform_individual_per_vehicle
  one_unique_vType_per_vehicle: true
  apparentDecel: set equal to sampled decel
  emergencyDecel: 9.0 m/s^2 fixed, greater than all decel bounds
  constraints:
  - tau >= actionStepLength for every individual (after step rounding)
  - all sampled parameters have valid SUMO 1.28.0 ranges
  - vClass passenger; preserve existing OD and depart
  - record each sampled value in driver_parameters.parquet
  - do not assign age or insurance-risk labels
